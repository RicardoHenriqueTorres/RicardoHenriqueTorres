  <text x="385" y="423" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#168cff">||</text>
  <text x="430" y="423" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.2" fill="#c8d3dc">Backend</text>
  <text x="555" y="423" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#168cff">||</text>
  <text x="600" y="423" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.2" fill="#c8d3dc">Database</text>

  <!-- Right detail -->
  <rect x="1100" y="160" width="2" height="150" fill="#168cff" opacity=".85"/>
  <text x="1130" y="196" font-family="monospace" font-size="18" fill="#168cff">developer.profile</text>
  <text x="1130" y="229" font-family="monospace" font-size="17" fill="#63788c">backend = true;</text>
  <text x="1130" y="258" font-family="monospace" font-size="17" fill="#63788c">database = true;</text>
  <text x="1130" y="287" font-family="monospace" font-size="17" fill="#63788c">learning = "always";</text>
